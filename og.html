<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snehal Yelkar social card</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #f7f7f9; color: #15161c; font-family: Inter, system-ui, sans-serif; color-scheme: light; }
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 88px; }
  .mark { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: #5146a5; color: #fff; font-weight: 700; font-size: 20px; }
  h1 { margin: 36px 0 0; font-size: 92px; line-height: 1; letter-spacing: -.04em; font-weight: 700; }
  .eyebrow { margin-top: 20px; font: 500 22px JetBrains Mono, monospace; letter-spacing: .05em; text-transform: uppercase; color: #5146a5; }
  p { margin: 22px 0 0; font-size: 32px; line-height: 1.35; letter-spacing: -.01em; color: #3f414c; }
  .pills { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .pills span { padding: 9px 20px; border-radius: 999px; border: 1px solid #c9c3ef; background: #efedfb; color: #5146a5; font: 500 21px JetBrains Mono, monospace; }
  .url { position: absolute; right: 88px; bottom: 52px; font: 500 18px JetBrains Mono, monospace; color: #62646f; }
</style>
</head>
<body>
<div class="card">
  <span class="mark">SY</span>
  <h1>Snehal Yelkar</h1>
  <div class="eyebrow">Senior Full-Stack AI Engineer</div>
  <p>I work on agentic AI, retrieval and full-stack systems on AWS.</p>
  <div class="pills"><span>Agentic AI</span><span>Search and RAG</span><span>Full-stack</span><span>AWS + Terraform</span></div>
</div>
<div class="url">yelkar-snehal.github.io/resume</div>
</body>
</html>
